<!DOCTYPE html>
<!-- draw.io 独立窗口跳板（仅桌面壳内使用）。
     iframe 地址直接写在 HTML 中，控制逻辑使用同源外部脚本，避免 PakePlus/Tauri
     子窗口 CSP 阻止内联脚本后只剩白屏。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>draw.io 编辑器</title>
  <link rel="stylesheet" href="drawio-host.css?v=r24.2.1">
</head>
<body>
  <div class="host-status" id="hostStatus" role="status" aria-live="polite">
    <div class="host-card">
      <span class="host-spinner" aria-hidden="true"></span>
      <h1 id="hostTitle">正在加载 draw.io</h1>
      <p class="host-version">桥接版本 r24.2.1</p>
      <p id="hostText">正在连接在线编辑器，首次打开可能需要 10–30 秒。</p>
      <div class="host-actions" id="hostActions" hidden>
        <button type="button" id="hostRetry">重新加载</button>
        <button type="button" id="hostDirect">直接打开 draw.io</button>
        <button type="button" id="hostClose">关闭窗口</button>
      </div>
      <p class="host-note" id="hostNote" hidden>直接打开后可以编辑和下载文件，但无法自动回存到科研工作台。</p>
    </div>
  </div>
  <iframe id="f" title="draw.io 在线编辑器" src="https://embed.diagrams.net/?embed=1&amp;proto=json&amp;spin=1&amp;ui=min"></iframe>
  <script src="drawio-host.js?v=r24.2.1"></script>
</body>
</html>
